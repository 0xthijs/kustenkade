<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPP-dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: vaste donkere navigatiekolom links, werkblad in het midden, gesprekshulp rechts. Eén donker thema. */
:root{
  color-scheme:dark;
  --bg:#0d0e10; --side:#111214; --card:#131417; --raise:#191a1e; --field:#17181c;
  --line:#22242a; --line2:#2d3038; --ink:#ededf0; --muted:#9c9ea8; --dim:#6f727d;
  --accent:#a3a4f7; --accent-ink:#101124; --accent-soft:#1f2036;
  --pos:#6fcf97; --pos-bg:#14291d; --neg:#f08875; --neg-bg:#371d19; --warn:#e6b455; --warn-bg:#35290f; --inf:#78b4f0; --inf-bg:#13273b; --neu:#a7aab4; --neu-bg:#202228;
  --body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.85rem} h2{font-size:1.07rem} h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k{font-family:var(--mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}

.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;font-weight:700;font-size:1.1rem;letter-spacing:-.02em}
.brand i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#6f70d8);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:.7rem;font-weight:700}
.ws{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.ws input{border:0;background:transparent;padding:0;font-weight:600;width:100%;border-radius:4px}
.ws small{color:var(--dim);font-size:.8rem}
.pr{padding:0 8px;display:flex;flex-direction:column;gap:6px}
.pr .bar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.pr .bar span{height:4px;border-radius:2px;background:var(--line2)}
.pr .bar span.prep{background:var(--warn)} .pr .bar span.disc{background:var(--inf)} .pr .bar span.ok{background:var(--pos)}
.pr small{color:var(--dim);font-size:.78rem}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .k{padding:14px 10px 6px}
.nav button{display:grid;grid-template-columns:22px 1fr 8px;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
.nav button:hover{background:var(--raise);color:var(--ink)}
.nav button[aria-current="step"]{background:var(--accent-soft);color:var(--ink)}
.nav .nr{font-family:var(--mono);font-size:.78rem;color:var(--dim)}
.nav button[aria-current="step"] .nr{color:var(--accent)}
.nav .t{font-size:.94rem;font-weight:500;line-height:1.25}
.nav .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line2)}
.nav .dot.prep{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.nav .dot.disc{border-color:var(--inf);background:var(--inf)} .nav .dot.ok{border-color:var(--pos);background:var(--pos)}
.nav .later{opacity:.55}

.col{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 28px;border-bottom:1px solid var(--line)}
.crumb{color:var(--dim);font-size:.92rem;flex:1 1 200px}
.crumb b{color:var(--ink);font-weight:500}
.top .right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--card)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:500;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.save{font-size:.82rem;color:var(--muted);display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
.save:empty{display:none}
.save i{width:7px;height:7px;border-radius:50%;background:var(--pos)}
.save.bezig i{background:var(--warn)} .save.fout i{background:var(--neg)} .save.fout{color:var(--neg)}

main{padding:26px 28px 70px;min-width:0;max-width:1500px}
.ttl h1{margin-bottom:4px}
.ttl p{color:var(--muted);font-size:1.02rem;max-width:72ch}
.ttl p.intro{color:var(--ink);font-size:.98rem;margin-top:10px;max-width:80ch;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 18px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;font-size:.88rem;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:7px;font-size:.82rem;font-weight:500;background:var(--neu-bg);color:var(--neu);white-space:nowrap}
.pill.prep{background:var(--warn-bg);color:var(--warn)} .pill.disc{background:var(--inf-bg);color:var(--inf)} .pill.ok{background:var(--pos-bg);color:var(--pos)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor}
.pill.prep::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)} .pill.disc::before,.pill.ok::before{background:currentColor}

.amb{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--card);border-radius:var(--r);padding:13px 18px;margin-bottom:18px}
.amb p{font-size:1.02rem;max-width:90ch}
.amb p.leeg{color:var(--dim)}
@media (max-width:720px){.amb{grid-template-columns:1fr}}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.work{display:flex;flex-direction:column;gap:16px;min-width:0}
.aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card>header{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.card>header h2{margin-right:2px}
.card>header .sp{flex:1}
.sub{color:var(--muted);font-size:.9rem;margin-top:-8px}
.aside .card{padding:16px 18px;gap:10px}
.aside ul,.sumlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.92rem;color:var(--muted)}
.aside ul li,.sumlist li{padding-left:14px;position:relative}
.aside ul li::before,.sumlist li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--line2)}
.sumlist li b,.aside li b{color:var(--ink);font-weight:500}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.lab label{font-weight:500;font-size:.92rem}
.prep{font-family:var(--mono);font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.hint{font-size:.84rem;color:var(--dim)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--field);min-width:0}
input:hover,select:hover,textarea:hover{border-color:#3a3d47}
textarea{resize:vertical;min-height:2.6em}
input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
::placeholder{color:var(--dim)}

.btn{border:1px solid var(--line2);background:var(--raise);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn.del{color:var(--dim);border-color:transparent;background:transparent;padding:4px 8px}
.btn.del:hover,.btn.del.armed{color:var(--neg);border-color:var(--neg)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.btn.vb{padding:1px 8px;font-size:.76rem;color:var(--accent);background:transparent;border-color:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.info{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);background:var(--raise);color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer;padding:0;line-height:1;flex:none}
.info:hover{border-color:var(--accent);color:var(--accent)}
.pop{position:fixed;z-index:50;background:#22242b;border:1px solid var(--line2);color:var(--ink);padding:13px 15px;border-radius:10px;font-size:.9rem;box-shadow:0 12px 32px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
.pop[hidden]{display:none}
.pop b{font-weight:600}
.pop span{color:var(--muted)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{font-size:.82rem;color:var(--dim);text-align:left;font-weight:500;padding:9px 12px;background:var(--raise);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);color:var(--dim);font-size:.82rem}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;gap:8px;align-items:start}
.row.r-betr{grid-template-columns:minmax(120px,1fr) minmax(140px,1.5fr) auto}
.row.r-doel{grid-template-columns:minmax(160px,1fr) 150px auto}
.row.r-fac{grid-template-columns:minmax(160px,1fr) 130px 140px auto}
@media (max-width:640px){.row.r-betr,.row.r-doel,.row.r-fac{grid-template-columns:1fr 1fr}.row>:first-child{grid-column:1/-1}}

.ex{border:1px dashed var(--line2);border-radius:9px;padding:9px 13px;font-size:.9rem}
.ex summary{cursor:pointer;font-weight:500;color:var(--accent)}
.ex p,.ex ul{margin:8px 0 2px;color:var(--muted)} .ex ul{padding-left:1.1em} .ex b{color:var(--ink);font-weight:500}
.prev{border-top:1px solid var(--line);padding-top:9px}
.prev:first-of-type{border-top:0;padding-top:0}
.prev summary{cursor:pointer;font-weight:500;font-size:.9rem}
.prev ul{margin-top:8px}

.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.78rem;font-weight:500;white-space:nowrap;background:var(--neu-bg);color:var(--neu)}
.tag.neg{background:var(--neg-bg);color:var(--neg)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.pos{background:var(--pos-bg);color:var(--pos)} .tag.acc{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--dim);font-size:.9rem}
.note{padding:10px 13px;border-radius:9px;font-size:.9rem;background:var(--raise);color:var(--muted);border:1px solid var(--line)}
.note.ok{background:var(--pos-bg);color:var(--pos);border-color:transparent} .note.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent} .note.bad{background:var(--neg-bg);color:var(--neg);border-color:transparent}
.banner{margin:0 0 16px}

.sugs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sug{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:999px;padding:3px 11px;font-size:.82rem;cursor:pointer;text-align:left}
.sug:hover{border-color:var(--accent);color:var(--ink)}
.sug::before{content:"+ ";color:var(--accent)}
.dfield{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:9px}
.dfield:first-of-type{border-top:0;padding-top:0}
.dfield .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dfield .hd b{font-weight:600}
.teller{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.teller>div{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--raise);display:flex;flex-direction:column;gap:5px}
.teller .n{font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.teller .n small{font-size:.84rem;font-weight:400;color:var(--dim)}
.teller .m{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.teller .m i{height:4px;border-radius:2px;background:var(--line2)}
.teller .kans .m i.on{background:var(--pos)} .teller .bedr .m i.on{background:var(--neg)} .teller .m i.over{background:var(--warn)}

.cov{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cov>div{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--raise);min-width:0}
.cov b{display:block;font-weight:500;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cov span{font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums}
.cov span em{font-style:normal} .cov .p{color:var(--pos)} .cov .n{color:var(--neg)}
.cov .leeg{opacity:.55}
@media (max-width:900px){.cov{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mx{display:grid;grid-template-columns:86px minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx>div{padding:11px 13px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.mx>div:nth-child(3n){border-right:0}
.mx>div:nth-last-child(-n+3){border-bottom:0}
.mx .h{background:var(--raise);font-size:.84rem;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.mx .h.kans{box-shadow:inset 0 2px 0 var(--pos)} .mx .h.bedr{box-shadow:inset 0 2px 0 var(--neg)}
.mx .rh{background:var(--raise);display:flex;flex-direction:column;gap:2px;justify-content:center}
.mx .rh b{font-weight:500;font-size:.9rem}
.mx .cell{display:flex;flex-direction:column;gap:7px}
.mi{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:start;font-size:.92rem}
.fb{font-family:var(--mono);font-size:.7rem;height:20px;border-radius:5px;background:var(--neu-bg);color:var(--neu);display:grid;place-items:center;margin-top:1px}
@media (max-width:640px){.mx{grid-template-columns:60px minmax(0,1fr) minmax(0,1fr)}}
.mk{display:grid;grid-template-columns:minmax(120px,1.2fr) auto auto 1fr;gap:8px 12px;align-items:center;font-size:.92rem}
.mk .ar{color:var(--dim)}

.swot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swot>div{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--raise);min-width:0}
.swot h3{margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.swot h3 small{font-weight:400;color:var(--dim);font-size:.78rem}
.swot .s{box-shadow:inset 0 2px 0 var(--pos)} .swot .w{box-shadow:inset 0 2px 0 var(--warn)} .swot .o{box-shadow:inset 0 2px 0 var(--inf)} .swot .t{box-shadow:inset 0 2px 0 var(--neg)}
@media (max-width:640px){.swot{grid-template-columns:1fr}}
.segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.segs>div{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:8px}

.tl{position:relative;height:104px;margin:6px 16px 0}
.tl .track{position:absolute;left:0;right:0;top:51px;height:2px;background:var(--line2)}
.tl .dot{position:absolute;top:39px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:.8rem;box-shadow:0 0 0 4px var(--card)}
.tl .lbl{position:absolute;transform:translateX(-50%);font-size:.74rem;color:var(--muted);white-space:nowrap}
.tl .lbl.up{top:15px} .tl .lbl.dn{top:72px}
.tl .tick{position:absolute;top:45px;width:1px;height:14px;background:var(--dim);opacity:.6}
.tl .mn{position:absolute;top:90px;font-family:var(--mono);font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}

.tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs .tab{border:0;border-bottom:2px solid transparent;background:transparent;padding:8px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs .tab[aria-selected="true"]{border-color:var(--accent);color:var(--ink)}
.opm{display:flex;flex-direction:column;gap:8px}
.opm .o{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;font-size:.9rem;padding:9px 10px;border-radius:9px;background:var(--raise);border:1px solid var(--line)}
.opm .o.af .tx{text-decoration:line-through;color:var(--dim)}
.opm .o small{display:block}
.grid7{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.gtabs{display:flex;flex-wrap:wrap;gap:6px}
.gtabs button{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:.9rem}
.gtabs button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.subh{font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:7px;margin-top:4px}
.ch{width:100%;height:auto;display:block}
.ch .cl{fill:var(--muted);font-size:12px} .ch .cv{fill:var(--ink);font-size:12px;font-variant-numeric:tabular-nums} .ch .ax{fill:var(--dim);font-size:11px} .ch .gr{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.chbox{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--raise);display:flex;flex-direction:column;gap:10px;min-width:0}
.chbox.wide{grid-column:1/-1}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.hr3p{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hr3p>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--raise);display:flex;flex-direction:column;gap:6px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;min-width:120px}
.stack i{display:block;height:100%}
.pm{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:3px;max-width:560px}
.pm .c{aspect-ratio:1.5;border-radius:6px;background:var(--raise);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;padding:3px}
.pm .c.m{background:var(--warn-bg);border-color:transparent} .pm .c.h{background:var(--neg-bg);border-color:transparent}
.pm .ax{display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;color:var(--dim)}
.pm .d{width:22px;height:22px;border-radius:50%;background:var(--neu-bg);border:1px solid var(--line2);color:var(--ink);font-size:.72rem;font-weight:600;display:grid;place-items:center}
.pm .d.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

function parseCSV(text,sep){
  const out=[];let row=[],cur="",inq=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inq){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=ch;}
    else if(ch==='"') inq=true;
    else if(ch===sep){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n") i++;row.push(cur);cur="";if(row.some(c=>c.trim()!=="")) out.push(row);row=[];}
    else cur+=ch;}
  row.push(cur);if(row.some(c=>c.trim()!=="")) out.push(row);
  return out;

function importCSV(text){
  const done=(k,m)=>{ui.csvMsg=[k,m];if(typeof document!=="undefined"){renderMain();renderNav();}};
  text=String(text||"").replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"",sep=[";","\t",","].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=parseCSV(text,sep);
  if(rows.length<2) return done("bad","Het bestand bevat geen gegevensregels. Gebruik het sjabloon.");
  const head=rows[0].map(c=>c.trim().toLowerCase());
  if(head.some(c=>/personeelsnummer|achternaam|voornaam|naam_medewerker|medewerkernaam|bsn|geboortedatum/.test(c))) return done("bad","Dit bestand lijkt gegevens per persoon te bevatten. Dat is niet toegestaan. Lever alleen totalen per functiegroep aan met het sjabloon.");
  if(head[0]!=="functiegroep"||head[12]!=="schaal"||head.length<17) return done("bad","De kolommen komen niet overeen met het sjabloon. Download het sjabloon opnieuw en vul dat in.");
  const nm=c=>{c=String(c==null?"":c).trim().replace(/\s/g,"").replace(",",".");return c===""||isFinite(Number(c))?c:"";};
  let upd=0,neu=0;
  rows.slice(1).forEach(r=>{const naam=(r[0]||"").trim();if(!naam) return;
    let g=state.fg.groepen.find(x=>(x.naam||"").trim().toLowerCase()===naam.toLowerCase());
    if(!g){g={id:uid(),naam,segment:"",schaars:null,aantal:"",nu:"",straks:""};state.fg.groepen.push(g);neu++;}else upd++;
    const d=g5(g.id);d.aantal=nm(r[1]);d.fte=nm(r[2]);d.coh=[3,4,5,6,7,8,9].map(i=>nm(r[i]));d.con=[10,11].map(i=>nm(r[i]));d.schaal=(r[12]||"").trim();d.verzuim=nm(r[13]);d.pens=[14,15,16].map(i=>nm(r[i]));
    d.idu=[0,1,2].map(y=>[0,1,2,3].map(c=>nm(r[17+y*4+c])));if(d.aantal) g.aantal=d.aantal;});
  ui.csvText=null;markDirty("s5");markDirty("fg");touch();
  done("ok",`${upd} functiegroepen bijgewerkt${neu?`, ${neu} nieuwe functiegroepen toegevoegd (vul in stap 4 het segment aan)`:""}.`);
}
async function saveFile(filename,data,mime){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){}
  if(dl){try{await dl.save({filename,data});return "ok";}catch(e){return e&&e.code==="declined"?"declined":"fail";}}
  if(typeof window.claude!=="undefined") return "fail";
  try{const u=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return "ok";}catch(e){return "fail";}
}

    if(bits.length) a.push(`<b>${esc(g.naam)}:</b> ${esc(bits.join("; "))}`);});

let db=null;const dirty=new Set(),timers={},writing={},again={};
const LS="spp-werkboek-v1";
function setSave(s){ui.save=s;renderSave();}
function markDirty(id){dirty.add(id);setSave("bezig");clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),700);}
async function flush(id){
  if(ui.mode==="local"){try{localStorage.setItem(LS,JSON.stringify(state));dirty.delete(id);setSave(dirty.size?"bezig":"ok");}catch(e){setSave("fout");}return;}
  if(!db) return;
  if(writing[id]){again[id]=true;return;}
  writing[id]=true;const body=JSON.stringify(state[id]);let fail=false;
  try{await db.doc("spp/"+id).set(JSON.parse(body));if(JSON.stringify(state[id])===body) dirty.delete(id);}
  catch(e){fail=true;if(e&&e.code==="invalid_argument"){ui.readOnly=true;render();}setSave("fout");}
  writing[id]=false;
  if(again[id]&&!fail){again[id]=false;flush(id);}else if(!fail) setSave(dirty.size?"bezig":"ok");
}
function merged(id,data){
  const d=Object.assign(defaults()[id],JSON.parse(JSON.stringify(data||{})));
  if(id==="fg") d.groepen.forEach(g=>{if(g.nu===undefined){g.nu={ruim:"makkelijk",gemiddeld:"gaatwel",krap:"lastig",zeerkrap:"zeerlastig"}[g.krapte]||"";g.straks="";}});
  return d;
}
function typing(){const a=document.activeElement;return !!(a&&a.matches&&a.matches("input[type=text],input[type=number],input[type=date],textarea"));}
function startLocal(){
  try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);DOCS.forEach(id=>{if(o[id]) state[id]=merged(id,o[id]);});}}catch(e){}
  ui.mode="local";render();
}
function initStore(){
  if(typeof window.claude==="undefined"||!window.claude.use){startLocal();return;}
  const slow=setTimeout(()=>{if(ui.mode==="loading"){ui.slow=true;render();}},10000);
  window.claude.use("db").then(d=>{
    if(!d){clearTimeout(slow);startLocal();return;}
    db=d;
    d.collection("spp").onSnapshot(snap=>{
      let changed=false;
      snap.docs.forEach(doc=>{
        if(!DOCS.includes(doc.id)||dirty.has(doc.id)||(doc.metadata&&doc.metadata.hasPendingWrites)) return;
        const m=merged(doc.id,doc.data());
        if(JSON.stringify(m)!==JSON.stringify(state[doc.id])){state[doc.id]=m;changed=true;}
      });
      const first=ui.mode==="loading"&&!(snap.metadata&&snap.metadata.fromCache);
      if(first){clearTimeout(slow);ui.mode="db";}
      if(first||(changed&&ui.mode==="db")){if(typing()&&!first) ui.pending=true;else render();}
    },()=>{clearTimeout(slow);if(ui.mode==="loading") startLocal();else{ui.readOnly=true;render();}});
  }).catch(()=>{clearTimeout(slow);startLocal();});
}

}
function doMerge(){
  const g=state.fg.groepen,sel=g.filter(x=>ui.merge.includes(x.id));if(sel.length<2) return;
  const rn={"":0,makkelijk:1,gaatwel:2,lastig:3,zeerlastig:4},rs={"":0,makkelijker:1,gelijk:2,lastiger:3};
  const tot=sel.reduce((s,x)=>s+(Number(x.aantal)||0),0);
  const m={id:uid(),naam:sel.map(x=>x.naam||"naamloos").join(" en "),segment:sel[0].segment,
    schaars:sel.every(x=>x.schaars==null)?null:sel.some(isSchaars),aantal:tot?String(tot):"",
    nu:sel.map(x=>x.nu||"").sort((a,b)=>rn[b]-rn[a])[0],straks:sel.map(x=>x.straks||"").sort((a,b)=>rs[b]-rs[a])[0]};
  mergeData(sel,m.id);
  const at=g.indexOf(sel[0]);
  state.fg.groepen=g.filter(x=>!ui.merge.includes(x.id));state.fg.groepen.splice(at,0,m);
  ui.merge=[];ui.notice=`Samengevoegd tot "${m.naam}". Pas de naam gerust aan.`;markDirty("fg");touch();
  if(typeof document!=="undefined"){renderMain();renderNav();}
}
function onInput(e){
  const el=e.target;
  if(el.dataset.path){
    const doc=el.dataset.doc;setP(state[doc],el.dataset.path,el.type==="checkbox"?el.checked:el.value);
    markDirty(doc);if(doc!=="meta") touch();refreshDerived();
  }
}
function onChange(e){
  const el=e.target;
  if(el.dataset.bk){const f=el.files&&el.files[0];if(f){const r=new FileReader();r.onload=()=>{backupImport(String(r.result||""));el.value="";};r.readAsText(f);}}
  else if(el.dataset.csv){const f=el.files&&el.files[0];if(f){const r=new FileReader();r.onload=()=>importCSV(String(r.result||""));r.onerror=()=>{ui.csvMsg=["bad","Het bestand kon niet worden gelezen."];renderMain();};r.readAsText(f);}}
  else if(el.dataset.path){if(el.dataset.doc==="fg"&&(el.tagName==="SELECT")){renderMain();renderNav();}
    else if(el.dataset.doc==="fg"&&ui.step===4&&el.dataset.path.endsWith(".aantal")) setTimeout(()=>{const id=document.activeElement&&document.activeElement.id;renderMain();const x=id&&document.getElementById(id);if(x) x.focus();},0);
    else if(el.dataset.doc==="s5"&&el.dataset.path.endsWith(".aantal")) setTimeout(()=>{const id=document.activeElement&&document.activeElement.id;renderMain();const x=id&&document.getElementById(id);if(x) x.focus();},0);
    else if(el.dataset.doc==="s7"&&el.dataset.path.startsWith("vraag.")) setTimeout(()=>{const id=document.activeElement&&document.activeElement.id;renderMain();const x=id&&document.getElementById(id);if(x) x.focus();},0);}
  else if(el.dataset.scensel) pickScen(Number(el.dataset.scensel),el.value);
  else if(el.dataset.status){state["s"+ui.step]._status=el.value;markDirty("s"+ui.step);renderMain();renderNav();}
  else if(el.dataset.aanzet){state["s"+ui.step]._aanzet=el.value;markDirty("s"+ui.step);renderMain();renderNav();}
  else if(el.dataset.opmaf){state["s"+ui.step]._opm[Number(el.dataset.opmaf)].af=el.checked;markDirty("s"+ui.step);renderMain();}
  else if(el.dataset.merge){const id=el.dataset.merge;ui.merge=el.checked?[...ui.merge,id]:ui.merge.filter(x=>x!==id);ui.notice="";renderMain();}
  else if(el.dataset.schaars){state.fg.groepen[Number(el.dataset.schaars)].schaars=el.value==="auto"?null:el.value==="ja";markDirty("fg");touch();renderMain();renderNav();}
}
function showPop(b,html,key){
  const p=document.getElementById("pop");
  if(!p.hidden&&p.dataset.for===key){closePop();return;}
  p.innerHTML=html;p.dataset.for=key;p.hidden=false;
  const r=b.getBoundingClientRect(),w=Math.min(340,window.innerWidth-24);
  p.style.width=w+"px";p.style.left=Math.max(12,Math.min(r.left-20,window.innerWidth-w-12))+"px";
  const below=r.bottom+8;p.style.top=(below+p.offsetHeight>window.innerHeight?Math.max(8,r.top-p.offsetHeight-8):below)+"px";
}
function closePop(){const p=document.getElementById("pop");if(p){p.hidden=true;p.dataset.for="";}}
function toggleSessie(){
  const on=!document.body.classList.contains("sessie");
  document.body.classList.toggle("sessie",on);try{localStorage.setItem(LS+"-sessie",on?"1":"");}catch(x){}renderMain();
  try{
    if(on&&document.documentElement.requestFullscreen){ui.fs=true;document.documentElement.requestFullscreen().catch(()=>{ui.fs=false;});}
    else if(!on&&document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  }catch(x){ui.fs=false;}
}
function boot(){
  try{const r=localStorage.getItem(LS+"-rol");if(r==="lg"||r==="hrbp") ui.role=r;}catch(e){}
  const m=/^#stap-(\d)$/.exec(location.hash);if(m) ui.step=Number(m[1]);else if(location.hash==="#overzicht") ui.step=-1;
  try{if(localStorage.getItem(LS+"-sessie")==="1") document.body.classList.add("sessie");}catch(e){}
  document.addEventListener("toggle",e=>{const k=e.target&&e.target.dataset&&e.target.dataset.as;if(k) ui.as[k]=e.target.open;},true);
  document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('section[data-act="go"]')){e.preventDefault();go(Number(e.target.dataset.n));}});
  document.addEventListener("click",onClick);
  document.addEventListener("input",onInput);
  document.addEventListener("change",onChange);
  document.addEventListener("focusout",()=>setTimeout(()=>{if(ui.pending&&!typing()) render();},50));
  document.addEventListener("keydown",e=>{if(e.key==="Escape") closePop();});
  window.addEventListener("scroll",closePop,{passive:true});
  document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&ui.fs){ui.fs=false;document.body.classList.remove("sessie");}});
  window.addEventListener("hashchange",()=>{const h=/^#stap-(\d)$/.exec(location.hash);if(h&&Number(h[1])!==ui.step) go(Number(h[1]));});
  render();initStore();
}
if(typeof document!=="undefined") boot();
if(typeof module!=="undefined") module.exports={prioHTML,overviewHTML,KPI,calc,gaps,csvTemplate,importCSV,g5,g6,state:()=>state,ui,defaults,merged,FORM,DER,SUM,asideHTML,stepMeta,doMerge,pickScen};
</script>
